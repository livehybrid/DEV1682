[restmap:rank_ssh_attackers]
description = Ranks IPv4 sources by failed SSH login volume in the installed Buttercup tutorial data. Use this first to select an actor, then pass the returned ip to get_ssh_source_profile, list_ssh_source_targets, and buttercup_storefront_mcp_profile_storefront_ip.
endpoint_name = buttercup_security_rank_ssh_attackers
method = post
headers = Accept, Content-Type
header.Accept = application/json
header.Content-Type = application/json
tags = buttercup, security, ssh, ranking

[restmap:get_ssh_source_profile]
description = Summarizes failed and successful SSH logins, distinct usernames, affected hosts, and observation times for one IPv4 source returned by rank_ssh_attackers.
endpoint_name = buttercup_security_ssh_source_profile
method = post
headers = Accept, Content-Type
header.Accept = application/json
header.Content-Type = application/json
tags = buttercup, security, ssh, actor-profile

[restmap:list_ssh_source_targets]
description = Lists the most-targeted hosts and usernames for one failed-SSH source IP. Use this after rank_ssh_attackers or get_ssh_source_profile to explain the attacker's targeting behavior.
endpoint_name = buttercup_security_ssh_source_targets
method = post
headers = Accept, Content-Type
header.Accept = application/json
header.Content-Type = application/json
tags = buttercup, security, ssh, targets

