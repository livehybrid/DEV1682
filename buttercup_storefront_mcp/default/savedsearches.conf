[Buttercup Storefront - Population Baseline]
search = search source="tutorialdata.zip:*" sourcetype="access_combined_wcookie" earliest=0 latest=now | rex field=_raw "^(?<bc_web_ip>\S+).*?\"(?<bc_http_method>\S+) (?<bc_request_uri>\S+)" | eval bc_endpoint=mvindex(split(bc_request_uri,"?"),0) | rex field=bc_request_uri "(?:[?&])action=(?<bc_request_action>[^&]+)" | rex field=bc_request_uri "(?:[?&])JSESSIONID=(?<bc_session_id>[^&]+)" | stats count AS requests dc(bc_session_id) AS sessions count(eval(bc_endpoint="/cart.do" AND bc_request_action="addtocart")) AS cart_add_requests count(eval(bc_endpoint="/cart.do" AND bc_request_action="purchase")) AS checkout_attempt_requests count(eval(bc_endpoint="/cart/success.do")) AS checkout_success_pages count(eval(bc_endpoint="/cart/error.do")) AS checkout_error_pages dc(eval(if(bc_endpoint="/cart/success.do",bc_session_id,null()))) AS completed_checkout_sessions dc(eval(if(bc_endpoint="/cart/error.do",bc_session_id,null()))) AS checkout_error_sessions count(eval(match(bc_endpoint,"^/(passwords\.pdf|hidden/anna_nicole\.html|rush/signals\.zip)$"))) AS notable_path_requests by bc_web_ip | stats count AS client_ips sum(requests) AS requests sum(sessions) AS sessions sum(cart_add_requests) AS cart_add_requests sum(checkout_attempt_requests) AS checkout_attempt_requests sum(checkout_success_pages) AS checkout_success_pages sum(checkout_error_pages) AS checkout_error_pages sum(completed_checkout_sessions) AS completed_checkout_sessions sum(checkout_error_sessions) AS checkout_error_sessions sum(notable_path_requests) AS notable_path_requests avg(requests) AS avg_requests median(requests) AS median_requests perc95(requests) AS p95_requests max(requests) AS max_requests avg(completed_checkout_sessions) AS avg_completed_checkout_sessions perc95(completed_checkout_sessions) AS p95_completed_checkout_sessions max(completed_checkout_sessions) AS max_completed_checkout_sessions | foreach avg_* p95_* [ eval <<FIELD>>=round(<<FIELD>>,2) ]
