[restmap:profile_storefront_ip]
description = Profiles storefront behavior for one IPv4 address, including sessions, cart activity, completed and failed checkout sessions, products seen, and notable paths. Use an ip returned by buttercup_security_mcp_rank_ssh_attackers to correlate security and commerce behavior.
endpoint_name = buttercup_storefront_ip_profile
method = post
headers = Accept, Content-Type
header.Accept = application/json
header.Content-Type = application/json
tags = buttercup, storefront, commerce, actor-profile

[restmap:list_storefront_sessions]
description = Lists bounded session summaries for one storefront IPv4 address. Filter for completed, error, or all sessions and use this after profile_storefront_ip to inspect products added and notable paths without returning raw events.
endpoint_name = buttercup_storefront_sessions
method = post
headers = Accept, Content-Type
header.Accept = application/json
header.Content-Type = application/json
tags = buttercup, storefront, commerce, sessions
